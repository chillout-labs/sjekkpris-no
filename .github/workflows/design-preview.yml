name: Design journey preview (no deploy)
on:
  push:
    branches: [frontend-v1-design]
    paths: ['home_ui.py', 'catalogue_ui.py', 'home_release.py', 'tools/preview_design.py', 'tools/capture_design.py', 'tools/design_assets/**', '.github/workflows/design-preview.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - run: python tools/preview_design.py
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/capture_design.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: design-journey-preview
          path: .design-preview
          retention-days: 7
