name: Design journey preview (no deploy)
on:
  push:
    branches: ["design/**", design/store-profile, design/guide-and-polish, design/complete-pages, design/category-navigation, design/category-insights, design/multi-facet-controls, design/card-key-facts, design/navigation-recovery, design/image-layouts, design/card-states, design/category-facets, design/category-help, design/guide-layout, design/beta-content, design/product-layout-finish, design/listing-spacing, design/home-header-categories, design/home-discovery-finish, design/mobile-product-top, design/manual-oct17, design-search-feedback-v1, design-search-states-v1, design-product-navigation-v1, design-shared-search-v1, frontend-v1-design, category-design-v1, design-history-v1]
    paths: ['tools/check_design_links.py', 'tests/test_design_links.py', 'tools/capture_store_state.py', 'tools/store_preview.py', 'tools/extended_pages.py', 'tools/capture_extended.py', 'tools/category_insights.py', 'category_catalog.py', 'tools/catalogue_scenarios.py', 'tools/guide_fixture.py', 'build.py', 'product_ui.py', 'rich_ui.py', 'tools/design_fixtures.py', 'home_ui.py', 'catalogue_ui.py', 'home_release.py', 'tools/preview_design.py', 'tools/capture_design.py', 'tools/design_assets/**', '.github/workflows/design-preview.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - run: python -m pip install playwright==1.58.0 pillow==11.3.0
      - run: python tools/preview_design.py
      - run: python tools/check_design_links.py .design-preview
      - run: python -m playwright install --with-deps chromium
      - run: python tools/capture_design.py
      - if: always()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: design-journey-preview
          path: .design-preview
          retention-days: 7
