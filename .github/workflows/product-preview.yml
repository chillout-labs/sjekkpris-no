name: Product preview (no deploy)
on:
  push:
    branches: [frontend-v1-design]
    paths: ['.github/workflows/product-preview.yml', 'build.py', 'product_ui.py', 'home_ui.py', 'home_release.py', 'assets/**', 'catalogue_media.py', 'tools/capture_products.py']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Classify complete event diff
        id: changes
        run: python .github/scripts/site_changes.py
      - name: Build real catalogue
        if: steps.changes.outputs.operational == 'true'
        env:
          CHILLOUT_ORIGIN: ${{ vars.CHILLOUT_ORIGIN }}
          CHILLOUT_READ_KEY: ${{ secrets.CHILLOUT_READ_KEY }}
          BASE_PATH: /
          ROBOTS_NOINDEX: '1'
        run: python build.py --out _preview
      - name: Check generated output
        if: steps.changes.outputs.operational == 'true'
        env:
          CHILLOUT_ORIGIN: ${{ vars.CHILLOUT_ORIGIN }}
          CHILLOUT_READ_KEY: ${{ secrets.CHILLOUT_READ_KEY }}
        run: python check_output.py _preview
      - name: Install visual review browser
        if: steps.changes.outputs.operational == 'true'
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture real product pages
        if: steps.changes.outputs.operational == 'true'
        run: python tools/capture_products.py
      - if: steps.changes.outputs.operational == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: product-preview
          path: _preview
          retention-days: 7
