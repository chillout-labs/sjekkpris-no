name: Verify Pages candidate

# Push/merge and manual dispatch cannot publish. The legacy API build/upload/deploy
# branch is removed; unchanged build.py remains available as historical renderer.
# Publication must later reuse existing Pages actions with a separately authorized
# exact Delivery tree and current release authority/audit, never an API rebuild.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delivery_run_id:
        description: 'Optional SAME-REPO SYNTHETIC delivery-input artifact run; review only, never deploy'
        type: string
        default: ''
      result_sha256:
        description: 'Independently reviewed Delivery result SHA-256'
        type: string
        default: ''
      baseline_sha256:
        description: 'Independently reviewed complete baseline inventory SHA-256'
        type: string
        default: ''
      retirement_sha256:
        description: 'Optional independently reviewed test-catalogue retirement.json hash'
        type: string
        default: ''
      candidate_tree_sha256:
        description: 'Optional reviewed FINAL tree hash; stage in _site only, never upload/deploy'
        type: string
        default: ''
      indexable_candidate:
        description: 'Prepare indexable product/category candidate only; does not publish'
        type: boolean
        default: false
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Classify complete event diff
        id: changes
        run: python .github/scripts/site_changes.py
      - name: Test operational change guard
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
      - run: pip install Pillow==11.3.0
      - name: Validate beta preview packaging
        run: |
          python tools/preview_design.py
          python tools/package_beta.py _beta_test
          python tools/check_design_links.py _beta_test /beta/
      # FIXTURE data against a localhost stub. No secret, no network.
      - run: python -m unittest discover -s tests -v

  delivery-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.delivery_run_id != ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate independently supplied references
        env:
          DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          BASELINE_SHA256: ${{ inputs.baseline_sha256 }}
          RETIREMENT_SHA256: ${{ inputs.retirement_sha256 }}
          CANDIDATE_TREE_SHA256: ${{ inputs.candidate_tree_sha256 }}
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'[1-9][0-9]{0,19}', os.environ['DELIVERY_RUN_ID'])
          for key in ('RESULT_SHA256', 'BASELINE_SHA256'):
              assert re.fullmatch(r'[0-9a-f]{64}', os.environ[key])
          for key in ('RETIREMENT_SHA256', 'CANDIDATE_TREE_SHA256'):
              assert not os.environ[key] or re.fullmatch(r'[0-9a-f]{64}', os.environ[key])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chillout-labs/chillout-platform
          ref: e0cadebd2b1ebde941969ded3da7f7323250e568
          path: _core
          persist-credentials: false
          token: ${{ secrets.CORE_REPOSITORY_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chillout-labs/chillout-platform
          ref: 644489ce9b4276bc4c4bf5a07c8a55b008dd47f2
          path: _receiver
          persist-credentials: false
          token: ${{ secrets.CORE_REPOSITORY_READ_TOKEN || github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-input
          run-id: ${{ inputs.delivery_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/delivery-input
      - name: Receive, inspect and compare complete candidate (no publication)
        env:
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          BASELINE_SHA256: ${{ inputs.baseline_sha256 }}
          RETIREMENT_SHA256: ${{ inputs.retirement_sha256 }}
          CANDIDATE_TREE_SHA256: ${{ inputs.candidate_tree_sha256 }}
          INDEXABLE_CANDIDATE: ${{ inputs.indexable_candidate }}
          CHILLOUT_ORIGIN: ${{ vars.CHILLOUT_ORIGIN }}
        run: |
          extra=()
          if [ -n "$RETIREMENT_SHA256" ]; then
            extra+=(--retirement "$RUNNER_TEMP/delivery-input/retirement.json" --retirement-sha256 "$RETIREMENT_SHA256")
          fi
          if [ -n "$CANDIDATE_TREE_SHA256" ]; then
            extra+=(--pages-site _site --candidate-tree-sha256 "$CANDIDATE_TREE_SHA256")
          fi
          if [ "$INDEXABLE_CANDIDATE" = true ]; then extra+=(--indexable-candidate); fi
          python tools/review_delivery.py \
            --core _core/tools/pages_candidate.py \
            --receiver _receiver/src/chillout/pages_bundle.py \
            --bundle "$RUNNER_TEMP/delivery-input/bundle.tar" \
            --result-sha256 "$RESULT_SHA256" \
            --baseline "$RUNNER_TEMP/delivery-input/baseline.json" \
            --baseline-sha256 "$BASELINE_SHA256" \
            --baseline-site "$RUNNER_TEMP/delivery-input/baseline-site" \
            --environment test --synthetic-only --site "$RUNNER_TEMP/candidate-site" \
            --report "$RUNNER_TEMP/candidate-review.json" "${extra[@]}"
      # Optional _site is hash-verified input for the existing upload-pages-artifact path.
      # No build.py or API refetch occurs after review. Publication remains disconnected.
      # Deliberately no artifact upload, Pages configuration or deploy in this slice.
      # Real private inputs must not be staged in public Actions artifacts.

