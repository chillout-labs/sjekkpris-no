name: Category preview (no deploy)
on:
  push:
    branches: [design-shared-search-v1, category-design-v1]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test contracts
        run: python -m unittest discover -s tests -q
      - name: Build real catalogue
        env:
          CHILLOUT_ORIGIN: ${{ vars.CHILLOUT_ORIGIN }}
          CHILLOUT_READ_KEY: ${{ secrets.CHILLOUT_READ_KEY }}
          BASE_PATH: /
          ROBOTS_NOINDEX: '1'
        run: python build.py --out _preview
      - name: Check generated output
        env:
          CHILLOUT_ORIGIN: ${{ vars.CHILLOUT_ORIGIN }}
          CHILLOUT_READ_KEY: ${{ secrets.CHILLOUT_READ_KEY }}
        run: python check_output.py _preview
      - name: Install visual review browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Capture and check categories
        run: python tools/capture_categories.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: category-preview
          path: _preview
          retention-days: 7
