name: Private model preview tests (synthetic, no deploy)
on:
  pull_request:
    paths: ['tools/model_preview.py', 'tools/check_model_preview.py', 'tools/check_variant_discovery.py', 'tests/*model_preview*', 'tests/test_variant_discovery.py', 'home_ui.py', 'home_release.py', 'catalogue_ui.py', 'rich_ui.py', '.github/workflows/model-preview-test.yml']
permissions:
  contents: read
jobs:
  model-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install local test browser and accessibility checker
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/sjekkpris-a11y --ignore-scripts --no-audit --no-fund axe-core@4.10.3
      - name: Unit acceptance and 16 synthetic browser states
        run: |
          python -m unittest discover -s tests -p test_model_preview.py -v
          python tools/check_model_preview.py --out /tmp/sjekkpris-model-proof --axe /tmp/sjekkpris-a11y/node_modules/axe-core/axe.min.js
          python -m unittest discover -s tests -p test_variant_discovery.py -v
          python tools/check_variant_discovery.py
